name: Build and Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ipafont fonts-ipaexfont
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked

      - uses: actions/cache@v4
        with:
          path: book/_build/.jupyter_cache
          key: jupyter-cache-${{ hashFiles('uv.lock') }}-${{ hashFiles('book/**/*.md', 'book/**/*.ipynb') }}
          restore-keys: jupyter-cache-${{ hashFiles('uv.lock') }}-

      - name: Build Book
        run: |
          (cd book && uv run jupyter book build . -W --keep-going)
          uv run python src/fix_link.py

      - name: Publish to GitHub Pages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book/_build/html
