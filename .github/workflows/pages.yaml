name: Build and Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked

      - uses: actions/cache@v4
        with:
          path: book/_build/execute
          key: jupyter-cache-${{ hashFiles('uv.lock') }}-${{ hashFiles('book/**/*.md', 'book/**/*.ipynb') }}
          restore-keys: jupyter-cache-${{ hashFiles('uv.lock') }}-

      - name: Build Book
        working-directory: book
        env:
          BASE_URL: /ds-seminar
        # HTML 生成でまれに接続がリセットされる（ECONNRESET）ので、そのときだけやり直す
        run: |
          for attempt in 1 2 3; do
            uv run jupyter book build --html --execute --strict 2>&1 | tee build.log && exit 0
            grep -q ECONNRESET build.log || exit 1
          done
          exit 1

      - name: Make notebooks for Colab
        run: uv run python src/make_notebooks.py

      - name: Publish to GitHub Pages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book/_build/html
